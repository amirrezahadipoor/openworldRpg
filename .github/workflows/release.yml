name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  signed-builds:
    name: Signed APK + AAB + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Bootstrap toolchain (editor + export templates)
        run: bash tools/bootstrap_toolchain.sh --editor --templates

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/release.keystore" \
            -storepass openworldrpg -keypass openworldrpg \
            -alias openworldrpg -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenWorld RPG,O=amirrezahadipoor,C=DE"

      - name: Point Godot at SDK + wire release keystore + Gradle (AAB)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path="$SDK_DIR"
          export/android/java_sdk_path="$JAVA_HOME"
          export/android/debug_keystore="$HOME/release.keystore"
          export/android/debug_keystore_user="openworldrpg"
          export/android/debug_keystore_pass="openworldrpg"
          EOF
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/release.keystore\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="openworldrpg"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="openworldrpg"|' export_presets.cfg
          sed -i "s|keystore/release=\"\"|keystore/release=\"$HOME/release.keystore\"|" export_presets.cfg
          sed -i 's|keystore/release_user=""|keystore/release_user="openworldrpg"|' export_presets.cfg
          sed -i 's|keystore/release_password=""|keystore/release_password="openworldrpg"|' export_presets.cfg
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' export_presets.cfg
          grep -n "keystore/release=" export_presets.cfg

      - name: Import project (headless)
        run: /tmp/rpg-toolchain/bin/godot --headless --path . --import

      - name: Determine version tag
        id: ver
        run: |
          # On a tag push, GITHUB_REF is refs/tags/vX.Y.Z and we use it.
          # On workflow_dispatch there is no tag, so we take the version from
          # project.godot and prefix it with "v".
          #
          # This used to fall back to a hardcoded "v1.0.0", which silently
          # fabricated a "v1.0.0" release (and a git tag) whenever someone
          # dispatched the workflow manually. That is how the current bogus
          # v1.0.0 release was created. Never hardcode a release version here.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep -oP 'config/version="\K[^"]+' project.godot)
            [ -n "$VER" ] || { echo "::error::could not read config/version from project.godot"; exit 1; }
            TAG="v${VER}"
            echo "::warning::manual dispatch — using project.godot version ($TAG), not a release tag"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Gradle builds need the build template *inside* the project (res://android/);
      # --install-android-build-template must ride along with the export command.
      - name: Export signed release APK (Gradle, ARM64 + ARMv7)
        run: |
          mkdir -p build
          /tmp/rpg-toolchain/bin/godot --headless --path . \
            --install-android-build-template \
            --export-release "Android" "build/OpenWorldRPG-${{ steps.ver.outputs.tag }}.apk"
          ls -lh build/

      - name: Export signed release AAB (Gradle bundle)
        run: |
          # gradle_build/export_format: 0 = APK, 1 = AAB (extension alone is not enough).
          # Committed preset carries no export_format line, so append it for the bundle.
          sed -i '/^gradle_build\/use_gradle_build=/a gradle_build/export_format=1' export_presets.cfg
          /tmp/rpg-toolchain/bin/godot --headless --path . \
            --export-release "Android" "build/OpenWorldRPG-${{ steps.ver.outputs.tag }}.aab"
          sed -i 's|gradle_build/export_format=1|gradle_build/export_format=0|' export_presets.cfg
          ls -lh build/

      - name: Export signed debug APK (side-loadable)
        run: |
          /tmp/rpg-toolchain/bin/godot --headless --path . \
            --export-debug "Android" "build/OpenWorldRPG-${{ steps.ver.outputs.tag }}-debug.apk"
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.ver.outputs.tag }}
          path: |
            build/*.apk
            build/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "OpenWorld RPG ${{ steps.ver.outputs.tag }}"
          body: |
            Installable Android builds (ARM64 + ARMv7), signed.

            - `OpenWorldRPG-v*.apk` — release build, direct install
            - `OpenWorldRPG-v*-debug.apk` — debug build for side-loading / logcat
            - `OpenWorldRPG-v*.aab` — Play Store bundle

            Built from `${{ github.sha }}` by the release workflow.

            ---

            **Status: pre-playtest.** The game is feature-complete and CI-green, and
            this build carries the Phase B content pass (real 32 px LPC world art,
            real NPC/enemy characters, real CC0/CC-BY music and SFX). It has
            **not** yet been played through by a human on a device, and difficulty
            balancing is untuned. See `ROADMAP.md` Phase C.

            **Licensing:** assets include CC-BY-SA 3.0 (tiles, characters) and CC-BY
            (music) material. Attribution ships in the in-game credits screen and in
            `CREDITS.md`; these builds are redistributable as long as that
            attribution is retained.
          files: |
            build/*.apk
            build/*.aab
          fail_on_unmatched_files: true
