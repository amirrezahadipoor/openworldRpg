name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Headless smoke test (every push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Repo size budget gate (<= 120 MB)
        run: bash tools/check_repo_size.sh

      - name: Validate authored data (items/enemies/talents/quests/dialogues + world maps)
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          paths = sorted(set(glob.glob("data/*.json") + glob.glob("data/dialogue/*.json") + glob.glob("world/chunks/*.json")))
          for p in paths:
              json.load(open(p))
          print("validated %d JSON data files" % len(paths))
          EOF

      - name: Bootstrap toolchain (Godot editor only)
        run: bash tools/bootstrap_toolchain.sh --editor

      - name: Godot version
        run: /tmp/rpg-toolchain/bin/godot --version

      - name: Import project (headless)
        run: /tmp/rpg-toolchain/bin/godot --headless --path . --import

      - name: Headless smoke run — 300 frames of main scene (fails on ANY script error)
        run: |
          set -o pipefail
          timeout 90 /tmp/rpg-toolchain/bin/godot --headless --path . res://scenes/main.tscn --quit-after 300 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then
            echo "::error::Script errors detected in smoke run (see above)"
            exit 1
          fi
          echo "smoke run clean ✓"

      - name: Headless smoke run — main menu scene
        run: |
          timeout 60 /tmp/rpg-toolchain/bin/godot --headless --path . res://scenes/menus/main_menu.tscn --quit-after 120 | tee menu.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" menu.log; then
            echo "::error::Script errors in main menu"; exit 1
          fi
          echo "main menu clean ✓"

      - name: Automated gameplay tests (combat / loot / economy / quests / saves)
        run: |
          timeout 90 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/CombatTest.tscn | tee tests.log
          grep -q "TEST RESULT: PASS" tests.log || { echo "::error::gameplay tests failed"; exit 1; }
          echo "gameplay tests ✓"

      - name: Full main-story playthrough validation (q1 -> q4 + boss)
        run: |
          timeout 90 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/PlaythroughTest.tscn | tee playthrough.log
          grep -q "PLAYTHROUGH RESULT: PASS" playthrough.log || { echo "::error::playthrough validation failed"; exit 1; }
          echo "playthrough ✓"

      - name: NPC schedules + barks (Phase E §3)
        run: |
          timeout 90 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/NpcTest.tscn | tee npc.log
          grep -q "NPC RESULT: PASS" npc.log || { echo "::error::NPC schedule/bark validation failed"; exit 1; }
          echo "npc ✓"

      - name: "World map: settlements + dungeons (Phase E §1)"
        run: |
          timeout 90 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/WorldMapTest.tscn | tee worldmap.log
          grep -q "WORLDMAP RESULT: PASS" worldmap.log || { echo "::error::settlement/dungeon validation failed"; exit 1; }
          echo "worldmap ✓"

      - name: "Main quest chain: 100 steps, region/level fit, walkable end to end (Phase F)"
        run: |
          timeout 120 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/QuestTest.tscn | tee quests.log
          grep -q "QUEST RESULT: PASS" quests.log || { echo "::error::main quest chain validation failed"; exit 1; }
          echo "100-step chain ✓"

      - name: "Items, monsters and bosses: rarity ladder, placement, loot reachability (Phase F)"
        run: |
          timeout 120 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/ItemsTest.tscn | tee items.log
          grep -q "ITEMS RESULT: PASS" items.log || { echo "::error::item/monster/boss validation failed"; exit 1; }
          echo "items + monsters + bosses ✓"

      - name: Audio integrity (every play_music/play_sfx id is registered)
        run: |
          timeout 90 /tmp/rpg-toolchain/bin/godot --headless --path . res://tests/AudioTest.tscn | tee audio.log
          grep -q "AUDIO RESULT: PASS" audio.log || { echo "::error::audio integrity check failed"; exit 1; }
          echo "audio ✓"

  visual-capture:
    name: Visual capture (screenshot artifact)
    runs-on: ubuntu-latest
    needs: smoke-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap toolchain (Godot editor only)
        run: bash tools/bootstrap_toolchain.sh --editor

      - name: Install virtual display + software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Import project (headless)
        run: /tmp/rpg-toolchain/bin/godot --headless --path . --import

      - name: Render the real game and capture PNGs
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/rpg-toolchain/bin/godot --path . \
            res://tools/art/capture_screenshot.tscn --resolution 1280x720 | tee shot.log
          grep -q "SHOT 1 saved" shot.log || { echo "::error::screenshot capture failed"; exit 1; }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/rpg_shot_*.png
          retention-days: 30

  android-export:
    name: Android debug APK (main only)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Bootstrap toolchain (editor + export templates)
        run: bash tools/bootstrap_toolchain.sh --editor --templates

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot editor settings at the Android SDK + debug keystore
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path="$SDK_DIR"
          export/android/java_sdk_path="$JAVA_HOME"
          export/android/debug_keystore="$HOME/debug.keystore"
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"
          EOF
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/debug.keystore\"|" export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg

      - name: Import project (headless)
        run: /tmp/rpg-toolchain/bin/godot --headless --path . --import

      - name: Export debug APK (ARM64 + ARMv7)
        run: |
          mkdir -p build
          /tmp/rpg-toolchain/bin/godot --headless --path . --export-debug "Android" build/OpenWorldRPG-debug.apk
          ls -lh build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/*.apk
          retention-days: 30
